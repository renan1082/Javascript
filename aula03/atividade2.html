<body>
    <div class="p-3 text-primary-emphasis bg-primary-subtle border border-primary-subtle rounded-3">
  Média de Alunos
</div>

    <script>
        let nome = prompt('Digite o Nome do Funcionario:','');
        let salario = Number(prompt('Digite o Salario',''));
        const reajuste = 1.15;
        
        let valorReajustte = salario*0.15
        let salarioAtual = salario + (salario *0.15)
        
        document.write(`
        Nome do funcionario: ${nome}<br>
        Salario: ${salario}<br>
        Valor do reajuste: 15% <br>
        Valor do Reajuste: R$ ${valorReajustte}<br>
        Salario atual: ${salarioAtual}
        
        `)
        </script>
