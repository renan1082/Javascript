<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 03</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="p-3 mb-2 bg-primary-subtle text-primary-emphasis">AULA 02/ ATIVIDADE 3</div>

    <script>

        produto=prompt('Digite o nome do seu Produto:','')
        valor=prompt('Digite o valor:')
        quantidade=prompt('Digite a Quantidade:','')
        total=null

        total = (valor*quantidade)

        document.write(` <a href="#" class="list-group-item list-group-item-action list-group-item-dark">
        Produto: ${produto}<br>
        Preço: ${valor}<br>
        Quantidade: ${quantidade}<br>
        Total: ${total}
        
        </a>`)

        console.log(`
        Produto: ${produto}
        Preço: ${valor}
        Quantidade: ${quantidade}
        Total: ${total}
        `)
        


    </script>
</body>
</html>
