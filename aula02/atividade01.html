<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>

    <div class="p-3 mb-2 bg-primary-subtle text-primary-emphasis">AULA 02/ ATIVIDADE 1</div>
    
    <script>
        
        let mensalidade = 199.90;
        let matriculado = true;

        nome=prompt('Digite seu nome:','')
        idade=prompt('Digite sua idade:', '')

        document.write(`<a href="#" class="list-group-item list-group-item-action list-group-item-Dark">
            Dados para Teste:<br> 
            Nome: ${nome}<br>
            Idade: ${idade}<br>
            Mensalidade: ${mensalidade}<br>
            Matricula: ${matriculado}<br>
        </a>
        `)
        

        console.log(`
        Nome; ${nome} \n
        Tipo: ${typeof nome} \n

         Idade: ${idade} \n 
         Tipo: ${typeof idade} \n

         Mensalidade: ${mensalidade} \n
         Tipo: ${typeof mensalidade} \n

         Matricula: ${matriculado}
         Tipo: ${typeof matriculado}
         `)
    </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
