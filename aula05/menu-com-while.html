<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>

        let opcao = '';
        
        do{
            opcao = prompt('1 - Mensagens\n2 - Informação\n0 - Sair','');

            if(opcao === '1'){
                alert('Bem Vindo');
            }else if(opcao === '2'){
                alert('Estudando Javascript')
            }


        } while(opcao !== '0');


    </script>
</body>
</html>
