<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura de repetição</title>
</head>
<body>
    
<script>
    let numero = 100;

    while(numero >= 1){
        document.write(`
        <b> Valor: </b> ${numero}
        <hr>    
    `);
    numero--;
    }
    

    


</script>

</body>
</html>
